# Shared pytest settings. Run each plugin's tests from its own directory:
#   cd plugins/<plugin> && python -m pytest
# Tests that talk to a real Stash, StashDB or Whisparr skip unless
# STASH_PLUGINS_INTEGRATION=1 is set in the environment.
[pytest]
markers =
    network: hits live public websites; run with -m network
addopts = -m "not network" -p no:cacheprovider
