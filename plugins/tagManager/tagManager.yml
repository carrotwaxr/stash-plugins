name: Tag Manager
description: Match and sync local tags with stash-box endpoints. Features multi-endpoint support, tag caching, layered search (exact, fuzzy, synonym), and field-by-field merge dialog.
version: 0.7.0
url: https://github.com/carrotwaxr/stash-plugins

ui:
  javascript:
    - tag-manager.js
  css:
    - tag-manager.css
  # Served under /plugin/tagManager/assets/. Keep this to files the UI fetches.
  assets:
    /: assets

settings:
  enableFuzzySearch:
    displayName: Enable Fuzzy Search
    description: Use fuzzy matching for close variations (typos, etc). Enabled by default.
    type: BOOLEAN
  enableSynonymSearch:
    displayName: Enable Synonym Search
    description: Use custom synonym mappings. Enabled by default.
    type: BOOLEAN
  fuzzyThreshold:
    displayName: Fuzzy Match Threshold
    description: Minimum score (0-100) for fuzzy matches. Default is 80.
    type: NUMBER
  pageSize:
    displayName: Tags Per Page
    description: Number of tags to show per page. Default is 25.
    type: NUMBER
  syncDryRun:
    displayName: Scene Tag Sync - Dry Run
    description: Preview what tags would be added without making changes (caps at 200 scenes). Default is enabled for safety.
    type: BOOLEAN
  preferStashBoxName:
    displayName: Default to Stash-Box Name
    description: In the merge dialog, default the Name selection to the stash-box value instead of keeping the local name.
    type: BOOLEAN
  preferStashBoxDescription:
    displayName: Default to Stash-Box Description
    description: In the merge dialog, default the Description selection to the stash-box value instead of keeping the local description.
    type: BOOLEAN
  leaveParentTagsAlone:
    displayName: Leave Parent Tags Alone
    description: Don't create or assign category parent tags when importing/matching. Keeps your own tag hierarchy untouched (imports tags flat). Default is off.
    type: BOOLEAN
  categoryMappings:
    displayName: Category Mappings (Internal)
    description: JSON mapping of stash-box categories to local parent tag IDs, kept per stash-box endpoint. Managed automatically.
    type: STRING
  tagBlacklist:
    displayName: Tag Blacklist
    description: Tags to exclude from matching and sync. Separate patterns with , or ; (or use the Blacklist button on the Match tab for one per line). Plain text matches the whole tag name. Use /regex/ for a regular expression (e.g., /^\d+p$/).
    type: STRING

exec:
  - python
  - "{pluginDir}/tag_manager.py"
interface: raw

tasks:
  - name: Sync Scene Tags from StashDB
    description: Add missing tags to scenes from each linked stash-box. Tags you removed from a scene are not added back.
    defaultArgs:
      mode: sync_scene_tags
  - name: Reset Scene Tag Sync History
    description: Forget which stash-box tags each scene was synced with. The next sync considers every tag again, adding back tags you removed from scenes.
    defaultArgs:
      mode: reset_sync_history
