name: Tests

on:
  pull_request:
  # deploy.yml calls this before publishing
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir:
          - plugins/mcMetadata
          - plugins/missingScenes
          - plugins/performerImageSearch
          - plugins/sceneMatcher
          - plugins/tagManager
          - scripts/scene-file-deduper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          if [ -f "${{ matrix.dir }}/requirements.txt" ]; then
            pip install -r "${{ matrix.dir }}/requirements.txt"
          fi
      # Live-site tests (-m network) and live Stash tests (STASH_PLUGINS_INTEGRATION)
      # are excluded by pytest.ini and the tests themselves.
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: python -m pytest

  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check plugin JavaScript
        run: find plugins -name '*.js' -not -path '*/tests/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 -t node --check
      - name: tagManager JS tests
        run: |
          status=0
          for f in plugins/tagManager/tests/test_*.js; do
            echo "::group::$f"
            node "$f" || { echo "::error file=$f::failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Lint plugin manifests
        run: python .github/scripts/lint_manifests.py
